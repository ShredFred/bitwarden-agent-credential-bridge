name: Bug report
description: Report a reproducible problem in the fake-only research harness.
title: "bug: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not report suspected vulnerabilities here. Use private vulnerability reporting instead.
        Never include real credentials, tokens, vault references, private endpoints, or raw host output.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which published version or commit shows the problem?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Use value-free output only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Provide the smallest reproducible example using generated fake values only.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I used fake values only and did not include private machine or service details.
          required: true
